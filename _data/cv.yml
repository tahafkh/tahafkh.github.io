        start_date: 2023-09
        end_date: 2024-06
        summary: Investigated delay learning in convolutional spiking neural networks using surrogate-gradient learning. Implemented learnable axonal, dendritic, and synaptic delays using [dilated convolution with learnable spacings (DCLS)](https://github.com/K-H-Ismail/Dilated-Convolution-with-Learnable-Spacings-PyTorch) in ResNet-18-based spiking architectures for event-based datasets. Implemented selected components using Numba CUDA to gain hands-on experience with GPU programming and custom CUDA kernels.
