    Projects:
      - name: "[Dynamical RNNs](https://github.com/tahafkh/dynamical-rnns) — Cognitive Neurorobotics Project"
        summary: Built a from-scratch, Numba-accelerated Elman RNN with backpropagation through time, sequence-specific learnable initial states, and SGD/Adam optimization. Analyzed the resulting hidden-state dynamics and attractor structure.
      - name: "[Crystalline](https://github.com/Crystaline-Coin/crystaline) — Decentralized File-Storage Cryptocurrency"
        summary: Developed a Python proof of concept for a peer-to-peer, incentive-backed file-storage network. Implemented the blockchain, transaction and signature validation, node networking, fee calculation, tests, and a hybrid Proof-of-Work/redefined Proof-of-Activity consensus mechanism.
      - name: "[Oak](https://github.com/noushkia/Oak) — Marketplace Platform Backend"
        summary: Built and Dockerized a Java/Spring backend for an Amazon-style marketplace. Developed REST APIs for users, providers, commodities, ratings, comments, search, sorting, pagination, and recommendations; implemented JWT-protected authentication and GitHub OAuth sign-in.
      - name: "[Smart Pot](https://github.com/noushkia/Smart-Pot) — Automated Plant-Watering System"
        summary: "Built a three-controller Arduino/C++ system: a sensor board measures temperature and soil moisture, a master board applies the irrigation policy and displays measurements, and an actuator board drives the water pump by PWM. The controllers exchange data over Bluetooth serial communication."
      - name: "[xv6 Kernel](https://gitlab.com/btk-os) — Extended xv6 Teaching Kernel (Five OS-Lab Projects)"
        summary: Progressively extended a fork of MIT's xv6 with shell line-editing and shortcuts; custom process and filesystem system calls; a multi-level scheduler (round-robin, LCFS, and modified HRRN) with aging; semaphore synchronization; and `mmap` with demand paging, page-fault handling, and `fork` support.
      - name: "[Socket Server](https://github.com/tahafkh/Socket-Server) — TCP Socket Servers Suite"
        summary: Implemented FTP, HTTP, and multi-user chat servers in C++ using low-level TCP sockets. Built FTP command/data channels with authentication and file upload/download, HTTP request parsing and routing for static/binary content, and chat-session and messaging workflows.
